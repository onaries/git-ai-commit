name: Publish to npm & Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_VERSION: 11.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify npm for OIDC support
        run: corepack npm@${NPM_VERSION} --version

      - name: Install dependencies
        run: corepack npm@${NPM_VERSION} ci

      - name: Build
        run: corepack npm@${NPM_VERSION} run build

      - name: Test
        run: corepack npm@${NPM_VERSION} test

      - name: Publish
        run: corepack npm@${NPM_VERSION} publish --provenance --access public

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == ver || $2 == ver" ") found=1; next }
            found { print }
          ' CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.release_notes.outputs.NOTES }}" \
            --latest

      - name: Cleanup release branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh api repos/${{ github.repository }}/branches --paginate -q '.[].name' | \
            grep "^release/v${VERSION}" | \
            while read branch; do
              echo "Deleting branch: $branch"
              git push origin --delete "$branch" || true
            done
